<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a6e2c">
<title>EMM MONDIAL</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="splashScreen" class="screen active">
  <div class="splash-content">
    <img src="logo.png" alt="EMM" class="splash-logo" onerror="this.style.display='none'; document.getElementById('splashFallback').style.display='flex';">
    <div id="splashFallback" class="splash-fallback" style="display:none">EMM</div>
    <h1 class="splash-title">ÉGLISE MESSIANIQUE MONDIALE</h1>
    <h2 class="splash-subtitle">EMM MONDIAL</h2>
    <div class="splash-loader"></div>
  </div>
</div>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <img src="logo.png" alt="EMM" class="logo" style="width: 100%; max-width: 180px; height: auto; max-height: 180px; object-fit: contain; display: block; margin: 0 auto 15px auto;">
    <h1>ÉGLISE MESSIANIQUE MONDIALE</h1>
    <h2>EMM MONDIAL</h2>
    <p class="subtitle">Espace Église / Entité</p>
    
    <div class="input-group"><label>Email</label><input type="email" id="loginEmail"></div>
    <div class="input-group"><label>Mot de passe</label><input type="password" id="loginPassword"></div>
    <div class="input-group"><label>Téléphone WhatsApp</label><input type="tel" id="loginPhone" placeholder="+243..."></div>
    
    <button class="btn-primary" onclick="login()">Se connecter</button>
    <button class="btn-secondary" style="margin-top: 10px;" onclick="creerCompte()">Créer un compte église</button>
    <div style="text-align: center; margin-top: 10px; margin-bottom: 10px;">
      <a href="#" onclick="reinitialiserMotDePasse()" style="color: #0a6e2c; font-size: 14px; text-decoration: underline;">Mot de passe oublié ?</a>
    </div>
    <p id="loginError" class="error-msg"></p>
  </div>
</div>

<div id="mainScreen" class="screen">
  <div id="premiumAlertBanner" style="display: none; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; cursor: pointer;" onclick="ouvrirModalPremium()"></div>
